/**/*:
  ros__parameters:
    broker:
      #host: localhost 
      host: trailer 
      #host: 10.35.102.180
      port: 1883
      #user: soo
      #pass: soo
    bridge:
      ros2mqtt:
        ros_topics:
          - /ping/primitive
          - /MAV/control/trajectory_suggestion
          - /MAV/state/subsystem_state
          - /MAV/state/modes
          - /steve/v2x/ros2/rgs/denm
          - /MAV/state/position
          - /MAV/control/RO/path_suggestion
        /steve/v2x/ros2/denm:
          mqtt_topic: /denm
          primitive: true
        /MAV/control/trajectory_suggestion:
          mqtt_topic: MAV/control/trajectory_suggestion
          primitive: true
        /MAV/control/RO/path_suggestion:
          mqtt_topic: MAV/1/control/RO/path_suggestion
          primitive: true
        /MAV/state/subsystem_state:
          mqtt_topic: MAV/state/subsystem_state
          primitive: true
        /MAV/state/modes:
          mqtt_topic: MAV/1/state/modes
          primitive: true
        /MAV/state/position:
          mqtt_topic: MAV/1/state/position
          primitive: true
        /ping/primitive:
          mqtt_topic: pingpong/primitive
          primitive: true
      advanced:
        ros:
          qos:
            reliability:   "reliable"
            durability:    "volatile"
        mqtt:
          retained: true 
      mqtt2ros:
        mqtt_topics:
          - pingpong/primitive
          - MAV/control/trajectory_suggestion
          - MAV/control/trajectory_acknowledgement
          - MAV/1/control/RO/waypoint_suggestion
          - MAV/1/control/RO/path_acknowledgement
        MAV/1/control/RO/path_acknowledgement:
          ros_topic: /MAV/control/path_acknowledgement
          primitive: true
        MAV/1/control/RO/waypoint_suggestion:
          ros_topic: /MAV/control/waypoint_suggestion
          primitive: true
        MAV/control/trajectory_suggestion:
          ros_topic: /MAV/control/trajectory_suggestion
          primitive: true
        MAV/control/trajectory_acknowledgement:
          ros_topic: /MAV/control/trajectory_acknowledgement
          primitive: true

